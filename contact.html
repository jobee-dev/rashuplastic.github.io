    <style>
        /* Custom styles for the form */
        .form-input {
            width: 100%;
            padding: 1rem 1.125rem;
            border: 1px solid rgba(42, 61, 69, 0.2);
            border-radius: 0.75rem;
            background-color: #FFFFFF;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            line-height: 1.6;
        }

        .form-input:focus {
            outline: none;
            border-color: #429E9D;
            box-shadow: 0 0 0 3px rgba(66, 158, 157, 0.2);
        }

        textarea.form-input {
            padding: 1.125rem 1.25rem;
            min-height: 9rem;
        }

        .form-input::placeholder {
            color: rgba(42, 61, 69, 0.5);
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        /* Contact card horizontal padding (more space left/right) */
        .contact-card {
            padding-left: 1.5rem;
            padding-right: 1.5rem;
        }

        @media (min-width: 768px) {
            .contact-card {
                padding-left: 2.5rem;
                padding-right: 2.5rem;
            }
        }

        @media (min-width: 1024px) {
            .contact-card {
                padding-left: 3rem;
                padding-right: 3rem;
            }
        }
    </style>
    <script src="assets/js/components.js?v=6?v=2" defer></script>
</head>

<body class="bg-sand-white font-body text-deep-ocean">
    <a href="#main-content" class="skip-link">Skip to content</a>

    <!-- Header & Navigation -->
    <app-header></app-header>

    <main id="main-content">
        <!-- Page Header -->
        <section class="bg-hermit-orange/10 py-16 text-center">
            <div class="container mx-auto px-6">
                <h1 class="section-title">Get in Touch</h1>
                <p class="mt-4 max-w-3xl mx-auto text-lg leading-relaxed">Have a question, an idea for collaboration, or
                    just want to say hello? We'd love to hear from you. Fill out the form below and we'll get back to
                    you as soon as possible.</p>
            </div>
        </section>

        <!-- Contact Form Section -->
        <section class="py-16 md:py-20">
            <div class="container mx-auto px-6">
                <div class="max-w-2xl mx-auto bg-white contact-card py-12 rounded-xl shadow-lg">
                    <form id="contact-form">
                        <div id="form-result" class="mb-8 hidden"></div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                            <div>
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" id="name" name="name" class="form-input" placeholder="John Doe"
                                    required>
                            </div>
                            <div>
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" id="email" name="email" class="form-input"
                                    placeholder="you@example.com" required>
                            </div>
                        </div>
                        <div class="mb-8">
                            <label for="subject" class="form-label">Subject</label>
                            <input type="text" id="subject" name="subject" class="form-input"
                                placeholder="Collaboration Idea" required>
                        </div>
                        <div class="mb-8">
                            <label for="message" class="form-label">Message</label>
                            <textarea id="message" name="message" rows="6" class="form-input"
                                placeholder="Tell us more about your idea..." required></textarea>
                        </div>
                        <div class="text-center mt-10">
                            <button type="submit" id="submit-button"
                                class="btn-primary btn-cta-lg w-full md:w-auto">Send Message</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <app-footer></app-footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Mobile Menu
            const menuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            menuButton.addEventListener('click', () => {
                const isExpanded = menuButton.getAttribute('aria-expanded') === 'true';
                mobileMenu.classList.toggle('hidden');
                menuButton.setAttribute('aria-expanded', !isExpanded);
            });

            // Contact Form Logic
            const form = document.getElementById('contact-form');
            const formResult = document.getElementById('form-result');
            const submitButton = document.getElementById('submit-button');

            // !!! IMPORTANT !!!
            // REPLACE THIS URL WITH THE WEB APP URL YOU GET FROM GOOGLE APPS SCRIPT
            const scriptURL = 'https://script.google.com/macros/s/AKfycbzPRNVo4OGLFgPE2BJX750jjw28vNRpSgy2wl6_p6-49fhNZZYfs2py8CSVSinWN-zTpA/exec';

            form.addEventListener('submit', e => {
                e.preventDefault();

                submitButton.disabled = true;
                submitButton.textContent = 'Submitting...';

                fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                    .then(response => {
                        formResult.innerHTML = `<div style="background-color: #d1fae5; color: #065f46; padding: 1rem; border-radius: 0.5rem;">Thank you! Your message has been sent successfully.</div>`;
                        formResult.classList.remove('hidden');
                        form.reset();
                    })
                    .catch(error => {
                        formResult.innerHTML = `<div style="background-color: #fee2e2; color: #991b1b; padding: 1rem; border-radius: 0.5rem;">Oops! Something went wrong. Please try again.</div>`;
                        formResult.classList.remove('hidden');
                        console.error('Error!', error.message);
                    })
                    .finally(() => {
                        submitButton.disabled = false;
                        submitButton.textContent = 'Send Message';
                        setTimeout(() => {
                            formResult.classList.add('hidden');
                        }, 6000);
                    });
            });
        });
    </script>
</body>

</html>
